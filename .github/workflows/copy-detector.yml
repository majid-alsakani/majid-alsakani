name: Copy Detector

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan GitHub for copies carrying my fingerprints
        env:
          # Optional PAT with `public_repo` for wider code search.
          # Falls back to GITHUB_TOKEN when not configured.
          SCAN_TOKEN: ${{ secrets.COPY_SCAN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/copy_detector.py
