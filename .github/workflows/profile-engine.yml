name: profile-engine

on:
  schedule:
    - cron: "17 */6 * * *" # four times a day, off the hour to dodge runner congestion
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/profile-engine/**"
      - ".github/workflows/profile-engine.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profile-engine
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        working-directory: tools/profile-engine
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: tools/profile-engine
        run: ruff check .
      - name: Mypy
        working-directory: tools/profile-engine
        run: mypy profile_engine
        continue-on-error: true
      - name: Pytest
        working-directory: tools/profile-engine
        run: pytest

  refresh:
    name: Recompute profile metrics and report
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the GraphQL response cache
        uses: actions/cache@v4
        with:
          path: .cache/profile-engine
          key: profile-engine-graphql-${{ github.run_id }}
          restore-keys: |
            profile-engine-graphql-
      - name: Run the engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
          PYTHONPATH: tools/profile-engine
        run: |
          python -m profile_engine \
            --config tools/profile-engine/profile-engine.toml \
            --login "$PROFILE_LOGIN" \
            --cache-dir .cache/profile-engine
      - name: Validate the generated report
        run: |
          python - <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path("docs/profile-report.json").read_text())
          assert payload["schema_version"] >= 2, payload["schema_version"]
          assert payload["heatmap"]["days"], "heatmap series is empty"
          html = pathlib.Path("docs/index.html").read_text()
          assert "window.__REPORT__" in html and "<script src=" not in html
          print("report ok:", payload["totals"]["commits"], "commits ·",
                payload["heatmap"]["total"], "contributions ·",
                len(payload["heatmap"]["days"]), "days")
          PY
      - name: Commit the refreshed artefacts (signed via GitHub API)
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/scripts/signed_commit.py \
            "chore(profile): refresh metrics, heatmap and report [skip ci]" \
            README.md assets/generated docs
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    name: Publish the report to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
