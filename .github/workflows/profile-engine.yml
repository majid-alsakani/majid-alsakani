name: profile-engine

on:
  schedule:
    - cron: "17 */6 * * *" # four times a day, off the hour to dodge runner congestion
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/profile-engine/**"
      - ".github/workflows/profile-engine.yml"

permissions:
  contents: write

concurrency:
  group: profile-engine
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        working-directory: tools/profile-engine
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: tools/profile-engine
        run: ruff check .
      - name: Mypy
        working-directory: tools/profile-engine
        run: mypy profile_engine
        continue-on-error: true
      - name: Pytest
        working-directory: tools/profile-engine
        run: pytest

  refresh:
    name: Recompute profile metrics
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
          PYTHONPATH: tools/profile-engine
        run: python -m profile_engine --login "$PROFILE_LOGIN" --readme README.md --assets assets/generated
      - name: Commit the refreshed block
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "profile-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore(profile): refresh live metrics [skip ci]"
          git push
