name: update-gh-activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Update README with recent GitHub activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore(readme): refresh recent GitHub activity"
          MAX_LINES: 10
