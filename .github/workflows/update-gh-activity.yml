name: update-gh-activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/recent_activity.py"
      - ".github/workflows/update-gh-activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-readme-writers
  cancel-in-progress: false

jobs:
  build:
    name: Update README with recent GitHub activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/recent_activity.py
      - name: Commit updated README (signed via GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/signed_commit.py \
            "chore(readme): refresh recent GitHub activity [skip ci]" README.md
