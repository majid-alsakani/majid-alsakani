[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-engine"
version = "2.0.0"
description = "Self-updating GitHub profile analytics pipeline with commit heatmap and HTML/JSON reports — standard library only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Majid Al-Sakani" }]
keywords = ["github", "graphql", "analytics", "svg", "heatmap", "reporting", "automation", "profile-readme", "github-pages"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
profile-engine = "profile_engine.__main__:main"

[tool.setuptools]
packages = ["profile_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
